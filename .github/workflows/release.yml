name: Release

on:
  push:
    tags:
      - "v*.*.*" # Triggers on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.0.0)"
        required: true
        type: string

permissions:
  contents: read # Build jobs only read. publish-release raises this for itself.

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate release inputs
        env:
          GOOGLE_CALENDAR_CLIENT_ID: ${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}
          MICROSOFT_CALENDAR_CLIENT_ID: ${{ secrets.MICROSOFT_CALENDAR_CLIENT_ID }}
        run: |
          set -uo pipefail

          # The only hard gate. Installers built from a mismatched version claim
          # to be a release they are not, and no later step can correct that.
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "::error title=Version mismatch::Release tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION"
            exit 1
          fi

          # Calendar client ids are per-integration credentials, not build
          # requirements. Without one, that provider's Connect button reports it
          # is not configured (microsoftCalendarOAuth.js fails fast rather than
          # opening a browser on a broken URL) and every other feature is
          # untouched. A missing id should cost the release one integration, not
          # the release.
          missing=""
          [ -n "${GOOGLE_CALENDAR_CLIENT_ID:-}" ] || missing="$missing Google"
          [ -n "${MICROSOFT_CALENDAR_CLIENT_ID:-}" ] || missing="$missing Microsoft"
          if [ -n "$missing" ]; then
            echo "::warning title=Calendar integrations disabled::No OAuth client id configured for:$missing. Those providers cannot be connected in these builds."
            echo "⚠️ Calendar integrations unavailable in this build:$missing — no OAuth client id configured. Apple Calendar (macOS) is unaffected; it uses EventKit, not OAuth." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run quality checks
        run: npm run quality-check
      - name: Check translations
        run: npm run i18n:check
      - name: Audit dependencies
        run: npm audit
      - name: Build better-sqlite3 for the runner's node
        # --ignore-scripts skips the native build, so DB-backed tests silently
        # skip unless the binding is rebuilt for the CI Node runtime.
        run: npm rebuild better-sqlite3
      - name: Run tests
        run: npm test
        env:
          # keeps require("electron") from throwing when postinstall was skipped
          ELECTRON_OVERRIDE_DIST_PATH: /tmp
          # a skipped DB test here means the rebuild step above is gone: fail instead
          REQUIRE_DB_TESTS: "1"

  build-linux:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install platform-specific native binaries
        run: npm install @rollup/rollup-linux-x64-gnu lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu --no-save

      - name: Cache native binaries
        uses: actions/cache@v4
        with:
          path: resources/bin
          key: linux-x64-bin-${{ hashFiles('scripts/download-*.js') }}

      - name: Download whisper.cpp binaries
        run: node scripts/download-whisper-cpp.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Download llama-server binaries
        run: node scripts/download-llama-server.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Download sherpa-onnx binaries
        run: node scripts/download-sherpa-onnx.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Download yt-dlp binary
        run: node scripts/download-yt-dlp.js --current

      - name: Download Qdrant binary
        run: node scripts/download-qdrant.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Download meeting AEC helper
        run: node scripts/download-meeting-aec-helper.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: linux-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: linux-electron-

      - name: Install Linux build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libx11-dev libxtst-dev libatspi2.0-dev libglib2.0-dev libpipewire-0.3-dev pkg-config

      - name: Create runtime env
        run: |
          echo "GOOGLE_CALENDAR_CLIENT_ID=${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}" >> .env
          echo "GOOGLE_CALENDAR_CLIENT_SECRET=${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}" >> .env
          echo "MICROSOFT_CALENDAR_CLIENT_ID=${{ secrets.MICROSOFT_CALENDAR_CLIENT_ID }}" >> .env

      - name: Verify PipeWire system audio helper build
        run: |
          npm run compile:linux-system-audio
          # supportsNativeCapture reflects compile-time PipeWire linkage, so this passes on CI runners with no PipeWire daemon (where "ok" is false).
          resources/bin/linux-system-audio-helper probe | grep '"supportsNativeCapture":true'

      - name: Build Application
        run: npm run build:linux -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          # Not dist/. That directory also holds linux-unpacked/, the fully
          # expanded ~700 MB app that every one of these four packages already
          # contains — uploading it ships the same build five times.
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
          retention-days: 30

  build-windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install platform-specific native binaries
        run: npm install @rollup/rollup-win32-x64-msvc lightningcss-win32-x64-msvc @tailwindcss/oxide-win32-x64-msvc --no-save

      - name: Cache native binaries
        uses: actions/cache@v4
        with:
          path: resources/bin
          # The system-audio helper source is in the key so a republished
          # helper binary invalidates the cached copy.
          key: windows-x64-bin-${{ hashFiles('scripts/download-*.js', 'resources/windows-system-audio-helper.c') }}

      - name: Download whisper.cpp binaries
        run: node scripts/download-whisper-cpp.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Download llama-server binaries
        run: node scripts/download-llama-server.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Download sherpa-onnx binaries
        run: node scripts/download-sherpa-onnx.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Download yt-dlp binary
        run: node scripts/download-yt-dlp.js --current

      - name: Download Qdrant binary
        run: node scripts/download-qdrant.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Download meeting AEC helper
        run: node scripts/download-meeting-aec-helper.js --current
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Download nircmd.exe
        run: node scripts/download-nircmd.js
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Download windows-fast-paste.exe
        run: node scripts/download-windows-fast-paste.js
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Download windows-key-listener.exe
        run: node scripts/download-windows-key-listener.js
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Download windows-mic-listener.exe
        run: node scripts/download-windows-mic-listener.js
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Download windows-system-audio-helper.exe
        run: node scripts/download-windows-system-audio-helper.js
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Verify windows-system-audio-helper.exe
        shell: bash
        run: test -f resources/bin/windows-system-audio-helper.exe

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: windows-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: windows-electron-

      - name: Create runtime env
        shell: bash
        run: |
          echo "GOOGLE_CALENDAR_CLIENT_ID=${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}" >> .env
          echo "GOOGLE_CALENDAR_CLIENT_SECRET=${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}" >> .env
          echo "MICROSOFT_CALENDAR_CLIENT_ID=${{ secrets.MICROSOFT_CALENDAR_CLIENT_ID }}" >> .env

      - name: Build and Sign Application
        run: npm run build:win -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          # Excludes win-unpacked/, which the installer and the portable build
          # both already contain. *.exe does not match *.exe.blockmap.
          path: dist/*.exe
          retention-days: 30

  build-macos:
    needs: tests
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg-static for target architecture
        if: matrix.arch == 'x64'
        run: |
          rm -f node_modules/ffmpeg-static/ffmpeg
          npm_config_arch=x64 node node_modules/ffmpeg-static/install.js

      - name: Cache native binaries
        uses: actions/cache@v4
        with:
          path: resources/bin
          key: macos-${{ matrix.arch }}-bin-${{ hashFiles('scripts/download-*.js', 'scripts/build-globe-listener.js', 'resources/macos-globe-listener.swift', 'scripts/build-macos-fast-paste.js', 'resources/macos-fast-paste.swift', 'scripts/build-media-remote.js', 'resources/macos-media-remote.swift', 'scripts/build-macos-audio-tap.js', 'resources/macos-audio-tap.swift') }}

      - name: Compile macos-globe-listener binary
        run: npm run compile:globe -- --arch ${{ matrix.arch }}

      - name: Compile macos-fast-paste binary
        run: npm run compile:fast-paste -- --arch ${{ matrix.arch }}

      - name: Compile macos-media-remote binary
        run: npm run compile:media-remote -- --arch ${{ matrix.arch }}

      - name: Compile macos-audio-tap binary
        run: npm run compile:audio-tap -- --arch ${{ matrix.arch }}

      - name: Download whisper.cpp binaries
        run: node scripts/download-whisper-cpp.js --current --platform darwin --arch ${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Download llama-server binaries
        run: node scripts/download-llama-server.js --current --platform darwin --arch ${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Download sherpa-onnx binaries
        run: node scripts/download-sherpa-onnx.js --current --platform darwin --arch ${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Download yt-dlp binary
        run: node scripts/download-yt-dlp.js --current --platform darwin --arch ${{ matrix.arch }}

      - name: Download Qdrant binary
        run: node scripts/download-qdrant.js --current --platform darwin --arch ${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Download meeting AEC helper
        run: node scripts/download-meeting-aec-helper.js --current --platform darwin --arch ${{ matrix.arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: macos-${{ matrix.arch }}-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: macos-${{ matrix.arch }}-electron-

      - name: Setup macOS Code Signing
        id: signing
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -uo pipefail

          # Signing must never decide whether packaging happens. An absent
          # certificate is the normal case today; a present-but-broken one
          # (expired, wrong password, truncated base64) used to kill the job
          # with "SecKeychainItemImport: Unable to decode the provided data" —
          # an error that names the decode rather than the cause. Either way an
          # unsigned .app is a useful artifact and a red X is not, so every
          # failure here degrades to unsigned and the build continues.
          install_signing_identity() {
            [ -n "${APPLE_CERTIFICATE_BASE64:-}" ] || return 1

            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

            echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH" || return 1
            # A truncated or mistyped secret decodes to something, so check that
            # it is actually a certificate before building a keychain for it.
            [ -s "$CERTIFICATE_PATH" ] || return 1

            security create-keychain -p "runner" "$KEYCHAIN_PATH" || return 1
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH" || return 1
            security unlock-keychain -p "runner" "$KEYCHAIN_PATH" || return 1
            security import "$CERTIFICATE_PATH" -P "${APPLE_CERTIFICATE_PASSWORD:-}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH" || return 1
            security list-keychain -d user -s "$KEYCHAIN_PATH" || return 1
            security set-key-partition-list -S apple-tool:,apple: -s -k "runner" "$KEYCHAIN_PATH" || return 1

            # Notarization credentials are a separate secret, so a build can
            # legitimately be signed without being notarized.
            if [ -n "${APPLE_API_KEY_BASE64:-}" ]; then
              API_KEY_PATH=$RUNNER_TEMP/api_key.p8
              echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH" \
                && echo "APPLE_API_KEY=$API_KEY_PATH" >> "$GITHUB_ENV"
            fi
            return 0
          }

          if install_signing_identity; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Unsigned macOS build::No usable Developer ID certificate, so this build is not code signed. Packaging continued; Gatekeeper will refuse the app on first launch until the user right-clicks → Open."
          fi

      - name: Create runtime env
        run: |
          echo "GOOGLE_CALENDAR_CLIENT_ID=${{ secrets.GOOGLE_CALENDAR_CLIENT_ID }}" >> .env
          echo "GOOGLE_CALENDAR_CLIENT_SECRET=${{ secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}" >> .env
          echo "MICROSOFT_CALENDAR_CLIENT_ID=${{ secrets.MICROSOFT_CALENDAR_CLIENT_ID }}" >> .env

      - name: Build Application (${{ matrix.arch }})
        run: npm run build:mac -- --${{ matrix.arch }} --publish never
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.signed == 'true' }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify packaged macOS native binaries
        run: |
          APP_PATH=$(ls -d dist/mac*/Snowi.app | head -n1)
          for bin in macos-audio-tap macos-globe-listener macos-fast-paste macos-mic-listener macos-text-monitor macos-media-remote; do
            test -x "$APP_PATH/Contents/Resources/bin/$bin" || { echo "Missing in bundle: $bin"; exit 1; }
          done

      - name: Note signing status
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            echo "macOS ${{ matrix.arch }}: signed with Developer ID." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "macOS ${{ matrix.arch }}: **unsigned**. Copy the \"Unsigned builds\" section of README.md into the release notes." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-release
          # Excludes mac*/Snowi.app, which the .dmg and the .zip both contain.
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 30

      - name: Cleanup Certificates
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
          rm -f $RUNNER_TEMP/build_certificate.p12
          rm -f $RUNNER_TEMP/api_key.p8

  publish-release:
    # Uploading a workflow artifact is not publishing. Those live on the run
    # page, expire in 30 days, download as a zip wrapper instead of the
    # installer, and are invisible to anyone not signed in. This job is what
    # actually puts installers on the Releases page.
    needs: [build-linux, build-windows, build-macos]
    # Not `success()`: one platform failing should not withhold the three that
    # built. An incomplete set is published as a draft instead — see below.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # the only job that writes anything back to the repo
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect installers
        run: |
          set -euo pipefail
          mkdir -p release

          # Depth 2 (artifacts/<job>/<file>) is deliberate. electron-builder
          # writes installers directly into dist/, and everything below that —
          # win-unpacked/, mac-arm64/Snowi.app, linux-unpacked/ — is build
          # scaffolding that must never be published. Extension filtering alone
          # would drag .zip and .exe files out of those trees.
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            # Two jobs producing the same filename would mean one silently
            # overwrites the other, publishing one platform's build under a name
            # users read as another's.
            if [ -e "release/$name" ]; then
              echo "::error title=Duplicate asset::$name was produced by more than one build job"
              exit 1
            fi
            cp "$file" "release/$name"
          done < <(find artifacts -mindepth 2 -maxdepth 2 -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' \
               -o -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -print0)

          if [ -z "$(ls -A release)" ]; then
            echo "::error title=Nothing to release::No build job produced an installer."
            exit 1
          fi

          {
            echo "### Release assets"
            echo
            echo '```'
            (cd release && du -h -- *)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INCOMPLETE: ${{ needs.build-linux.result != 'success' || needs.build-windows.result != 'success' || needs.build-macos.result != 'success' }}
        run: |
          set -euo pipefail

          # Release notes come from the CHANGELOG entry for this exact version,
          # so the notes cannot drift from the file in the tag.
          VERSION="${RELEASE_TAG#v}"
          awk -v hdr="## [$VERSION]" '
            index($0, hdr) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes-body.md

          {
            echo "Downloads: **macOS** \`.dmg\` · **Windows** \`Snowi Setup *.exe\` · **Linux** \`.AppImage\`, \`.deb\`, \`.rpm\`"
            echo
            if [ -s notes-body.md ]; then
              cat notes-body.md
            else
              echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/CHANGELOG.md)."
            fi
          } > notes.md

          flags=()
          # Any tag with a suffix (-rc1, -beta.2) is not a final release.
          case "$RELEASE_TAG" in *-*) flags+=(--prerelease) ;; esac

          if [ "$INCOMPLETE" = "true" ]; then
            # A public release page missing the Windows installer does not read
            # as "Windows failed to build", it reads as "Windows unsupported".
            # Hold it as a draft until someone decides.
            flags+=(--draft)
            echo "::warning title=Incomplete release::A platform did not build. Published as a draft so a half-populated release is never public."
          fi

          # Re-running the workflow must refresh the assets, not fail on a tag
          # that already has a release.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --target "$GITHUB_SHA" \
              --title "Snowi $RELEASE_TAG" \
              --notes-file notes.md \
              "${flags[@]}"
          fi

          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "$GITHUB_STEP_SUMMARY"
